# http{} context snippet for Publivalla API (maps + rate limit).
# Install: sudo cp scripts/nginx/conf.d/publivalla-api-maps.conf /etc/nginx/conf.d/
#
# Loaded automatically by nginx.conf include /etc/nginx/conf.d/*.conf;

# Soft rate limit for / (burst is applied in the site config).
limit_req_zone $binary_remote_addr zone=publivalla_api:10m rate=40r/s;

# Scanner / abuse user-agents → $publivalla_drop_ua = 1
map $http_user_agent $publivalla_drop_ua {
    default                                                 0;
    ~*(libredtail|nikto|sqlmap|masscan|zgrab|nuclei|dirbuster|wfuzz|acunetix) 1;
}
