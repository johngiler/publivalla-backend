##
## api.publivalla.com — Publivalla API (Django + Gunicorn, WebSockets → Daphne)
## Copiar en el servidor: /etc/nginx/sites-available/api.publivalla.com.conf
## sudo cp scripts/nginx/conf.d/publivalla-api-maps.conf /etc/nginx/conf.d/
## sudo nginx -t && sudo systemctl reload nginx
##
## Hardening:
##   - default_server → 444 (drop IP / unknown Host)
##   - scan paths / bad query args → 444
##   - bot UA map (conf.d) → 444
##   - /ws/ → Daphne :8001; REST → gunicorn :8000

# ---------------------------------------------------------------------------
# Catch-all: anything that is not api.publivalla.com (IP scans, Host spoofing)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/api.publivalla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.publivalla.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 444;
}

# ---------------------------------------------------------------------------
# HTTP — ACME + redirect (real hostname only)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.publivalla.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.publivalla.com;

    server_tokens off;
    client_max_body_size 25M;

    # Drop known scanner user-agents (map in conf.d/publivalla-api-maps.conf).
    if ($publivalla_drop_ua) {
        return 444;
    }

    # Drop PHP / RCE probe query strings (e.g. allow_url_include=php://input).
    if ($args ~* "(allow_url_include|auto_prepend_file|php://input)") {
        return 444;
    }

    # Probe paths that never exist on this Django API.
    location ~* (^|/)\.(env|git|svn|htaccess|htpasswd)(/|$) {
        return 444;
    }
    location ~* (phpunit|eval-stdin\.php|wp-admin|wp-login|xmlrpc\.php|cgi-bin|vendor/phpunit) {
        return 444;
    }

    # WebSockets (notificaciones). Daphne en :8001; el REST sigue en gunicorn :8000.
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    location /static/ {
        alias /home/git/backend/staticfiles/;
    }

    location /media/ {
        alias /home/git/backend/media/;
    }

    location / {
        # Light flood brake (zone defined in conf.d/publivalla-api-maps.conf).
        limit_req zone=publivalla_api burst=80 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    ssl_certificate /etc/letsencrypt/live/api.publivalla.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.publivalla.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
}
