#? Config file for btop v. 1.3.0 — Publivalla ops
# Installed by scripts/tmux_ops.sh → ~/.config/btop/btop.conf
#
# Layout note (btop 1.3): engine is 2-zone only (metrics | proc), not a free
# 3-column grid. Closest ops view: CPU full top, MEM+NET left, PROC right.

color_theme = "Default"
theme_background = True
truecolor = True
force_tty = False
rounded_corners = True

# Preset 0 = always all boxes default. Extra presets (← → in UI):
# P on cpu = cpu_bottom; on mem = mem_below_net; on proc = proc_left.
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default"

shown_boxes = "cpu mem net proc"
update_ms = 1000

# Public NIC (not lo)
net_iface = "eth0"
net_auto = True
net_sync = True
# Decimal units (Kb/Mb) so bit rates read closer to kbps when shown
base_10_sizes = True

# Top consumers first (CPU). Mem column still visible; sort by mem with ← → on headers.
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_mem_bytes = True
proc_filter_kernel = True
proc_left = False
proc_per_core = False

# CPU on top (full width band)
cpu_bottom = False
show_uptime = True
check_temp = False
show_cpu_freq = True
cpu_single_graph = False

# Memory only (no disk clutter) above net
show_disks = False
mem_graphs = True
mem_below_net = False
show_swap = True
swap_disk = False

show_battery = False
show_gpu_info = False

graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"
