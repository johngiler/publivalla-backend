# Fail2ban filter — Publivalla API nginx access.log (combined).
#
# Matches:
#   - responses with status 444 (drop rules)
#   - common probe paths (even if status was 400)
#   - known scanner user-agents (libredtail, nikto, …)
#
# Log example:
#   1.2.3.4 - - [14/Sep/2026:17:58:40 +0000] "GET /vendor/phpunit/... HTTP/1.1" 444 0 "-" "libredtail-http"

[Definition]
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z

failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^"]* HTTP/[^"]*" 444\b
            ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^"]*(?:phpunit|eval-stdin\.php|wp-admin|wp-login|xmlrpc\.php|\.env(?:[/\s?]|$)|allow_url_include|auto_prepend_file|cgi-bin)[^"]*" (?:400|403|404|444)\b
            ^<HOST> \S+ \S+ \[\] "[^"]*" \d+ \d+ "[^"]*" "[^"]*(?:libredtail|nikto|sqlmap|masscan|zgrab|nuclei|dirbuster|wfuzz|acunetix)

ignoreregex =
